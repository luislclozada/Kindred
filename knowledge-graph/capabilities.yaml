# La columna de capacidades (capability spine): escrita a mano, y el ÚNICO lugar donde se
# crean ids de capacidad.
#
# Cada spec, cambio, feature y servicio se liga a una capacidad por su nombre:
# primero el id exacto, luego un alias exacto, luego el alias "prefijo-*" más largo que coincida.
# Lo que no se liga a nada aparece como UNBOUND en `ingest run`; se arregla aquí.
#
# Al proponer un cambio, agrega su nombre a los alias de la capacidad a la que pertenece
# (la skill kindred-propose lo hace), para que el trabajo en curso esté en el grafo desde el
# primer día.
#
# Los ids, alias y módulos van en inglés (son identificadores). `name` y `description` van en
# español: es el texto que el grafo busca, y las preguntas se le hacen en español.

capabilities:
  - id: student-profiles
    name: Perfiles de estudiantes
    description: Los estudiantes se registran con un nombre, un correo y una carrera, y pueden editar su nombre y su carrera.
    module: Students
    aliases: [student-service, student-*, edit-student-profile]

  - id: course-enrollment
    name: Catálogo de cursos e inscripción
    description: El catálogo de cursos, y los estudiantes que se inscriben en cursos o los dan de baja.
    module: Students
    aliases: [course-catalog, course-enrollment, enrollment-*]

  - id: classmate-discovery
    name: Descubrir compañeros
    description: Ve quién más toma tus cursos, ordenados por cursos en común.
    module: Students
    aliases: [classmate-*]

  - id: study-group-matching
    name: Formación de grupos de estudio
    description: Hoy, las listas de cada curso; después, formar grupos de estudio por curso y disponibilidad.
    module: Matching
    aliases: [matching-service, course-rosters, matching-*, group-*, availability-*]

  - id: platform
    name: Plataforma
    description: Gateway, kernel compartido, mensajería y la herramienta del grafo de conocimiento.
    module: Platform
    aliases: [gateway, shared-kernel, knowledge-graph, api-gateway]

# Uniones declaradas entre módulos. Los dos extremos de un puente están en el radio de impacto
# del otro.
bridges:
  - from: Matching
    to: Students
    via: student-enrolled-in-course
    kind: domain-event
    status: active
  - from: Matching
    to: Students
    via: student-renamed
    kind: domain-event
    status: active
