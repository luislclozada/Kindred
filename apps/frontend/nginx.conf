# Same shape as the dev server: the app at /, and /api proxied to the gateway.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://gateway:8080;
    }

    # Client-side routes (/courses, /classmates) all load the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
